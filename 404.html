<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 信号丢失 | 绝对零度</title>
    <link rel="icon" href="JDLD.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-900: #022c22;
            --green-800: #064e3b;
            --green-700: #065f46;
            --green-600: #047857;
            --green-500: #0d9488;
            --green-400: #10b981;
            --green-300: #34d399;
            --green-200: #6ee7b7;
            --green-100: #a7f3d0;
            --bg: #f8faf7;
            --text: #1a2e1a;
            --text-secondary: #3d5a3d;
            --text-muted: #6b8a6b;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Lang switch */
        .lang-switch {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            z-index: 100;
            display: flex;
            gap: 0.25rem;
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 3px;
            border: 1px solid rgba(16,185,129,0.2);
        }
        .lang-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all var(--transition);
            letter-spacing: 0.5px;
        }
        .lang-btn.active {
            background: var(--green-400);
            color: #fff;
            box-shadow: 0 2px 8px rgba(16,185,129,0.3);
        }

        /* Radar */
        .radar-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 2rem;
        }
        .radar-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(16,185,129,0.25);
            animation: radarPulse 2s ease-out infinite;
        }
        .radar-ring:nth-child(1) { width: 60px; height: 60px; animation-delay: 0s; }
        .radar-ring:nth-child(2) { width: 110px; height: 110px; animation-delay: 0.6s; }
        .radar-ring:nth-child(3) { width: 160px; height: 160px; animation-delay: 1.2s; }
        @keyframes radarPulse {
            0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
        }
        .radar-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green-400);
            box-shadow: 0 0 12px var(--green-400), 0 0 30px var(--green-400);
            z-index: 2;
        }
        .radar-scan {
            position: absolute;
            top: 50%; left: 50%;
            width: 80px; height: 2px;
            background: linear-gradient(90deg, var(--green-400), transparent);
            transform-origin: left center;
            animation: scanRotate 3s linear infinite;
            z-index: 1;
        }
        @keyframes scanRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 404 Number */
        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: var(--green-700);
            text-shadow:
                0 0 20px rgba(16,185,129,0.4),
                0 0 60px rgba(16,185,129,0.2);
            line-height: 1;
            margin-bottom: 0.5rem;
            animation: glitch 3s ease-in-out infinite;
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-3px, 2px); }
            94% { transform: translate(3px, -1px); }
            96% { transform: translate(-1px, -2px); }
            98% { transform: translate(2px, 1px); }
        }

        /* Title */
        .signal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--green-600);
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        /* Terminal */
        .terminal {
            background: rgba(6,47,34,0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            margin-bottom: 2rem;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: var(--green-200);
            position: relative;
        }
        .terminal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(16,185,129,0.3), transparent);
        }
        .terminal .line {
            margin-bottom: 0.5rem;
            min-height: 1.2em;
        }
        .terminal .prompt {
            color: var(--green-400);
        }
        .terminal .cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background: var(--green-400);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Button */
        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            transition: all var(--transition);
            cursor: pointer;
            text-transform: uppercase;
            background: var(--green-600);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(6,95,70,0.3);
        }
        .btn:hover {
            background: var(--green-700);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(6,95,70,0.4);
        }

        /* Footer text */
        .forest-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-code { font-size: 5rem; }
            .signal-title { font-size: 1rem; letter-spacing: 2px; }
            .terminal { font-size: 0.7rem; padding: 1rem; }
            .radar-container { width: 140px; height: 140px; }
            .radar-ring:nth-child(1) { width: 50px; height: 50px; }
            .radar-ring:nth-child(2) { width: 90px; height: 90px; }
            .radar-ring:nth-child(3) { width: 130px; height: 130px; }
            .radar-scan { width: 65px; }
        }
        @media (max-width: 420px) {
            .error-code { font-size: 3.5rem; }
            .signal-title { font-size: 0.8rem; }
            .btn { font-size: 0.65rem; padding: 0.6rem 1.4rem; }
            .lang-btn { font-size: 0.6rem; padding: 0.25rem 0.5rem; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <!-- Language Switch -->
    <div class="lang-switch" id="langSwitch">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">ZH</button>
    </div>

    <div class="content">
        <!-- Radar -->
        <div class="radar-container">
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-center"></div>
            <div class="radar-scan"></div>
        </div>

        <!-- 404 -->
        <div class="error-code">404</div>
        <div class="signal-title" data-i18n="signal_title">Signal Lost</div>

        <!-- Terminal -->
        <div class="terminal">
            <div class="line">
                <span class="prompt">JDLD@base:~$</span>
                <span data-i18n="terminal_line1">Locating target page...</span>
                <span class="cursor"></span>
            </div>
            <div class="line" data-i18n="terminal_line2" style="color:#ef4444;">
                Error: Coordinates not found. Signal lost.
            </div>
        </div>

        <!-- Button -->
        <a href="index.html" class="btn" data-i18n="btn_return">Return to Base</a>

        <!-- Footer -->
        <p class="forest-text" data-i18n="forest_text">Lost in the digital forest</p>
    </div>

    <script>
        // ===== i18n =====
        const i18n = {
            en: {
                signal_title: 'Signal Lost',
                terminal_line1: 'Locating target page...',
                terminal_line2: 'Error: Coordinates not found. Signal lost.',
                btn_return: 'Return to Base',
                forest_text: 'Lost in the digital forest'
            },
            zh: {
                signal_title: 'Signal Lost',
                terminal_line1: '\u5B9A\u4F4D\u76EE\u6807\u9875\u9762...',
                terminal_line2: '\u9519\u8BEF\uFF1A\u5750\u6807\u4E0D\u5B58\u5728\uFF0C\u4FE1\u53F7\u4E22\u5931\u3002',
                btn_return: '\u8FD4\u56DE\u57FA\u5730',
                forest_text: '\u8FF7\u5931\u5728\u6570\u5B57\u68EE\u6797'
            }
        };

        let currentLang = 'en';

        function applyLanguage(lang) {
            if (!i18n[lang]) return;
            currentLang = lang;
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key && i18n[lang][key] !== undefined) {
                    el.textContent = i18n[lang][key];
                }
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            localStorage.setItem('lang', lang);
        }

        function detectLocale() {
            const lang = (navigator.language || '').toLowerCase();
            return lang.startsWith('zh') ? 'zh' : 'en';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('lang') || detectLocale();
            applyLanguage(saved);
            setTimeout(() => applyLanguage(saved), 100);
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                applyLanguage(btn.getAttribute('data-lang'));
            });
        });

        // ===== Terminal Typing Effect =====
        function typeTerminal() {
            const line1El = document.querySelector('[data-i18n="terminal_line1"]');
            const cursorEl = document.querySelector('.cursor');
            const line2El = document.querySelector('[data-i18n="terminal_line2"]');
            const fullText = line1El.textContent;

            line1El.textContent = '';
            line2El.style.opacity = '0';
            let i = 0;

            function type() {
                if (i < fullText.length) {
                    line1El.textContent += fullText.charAt(i);
                    i++;
                    setTimeout(type, 60 + Math.random() * 40);
                } else {
                    cursorEl.style.display = 'none';
                    setTimeout(() => {
                        line2El.style.opacity = '1';
                        line2El.style.transition = 'opacity 0.5s';
                    }, 400);
                    setTimeout(() => {
                        cursorEl.style.display = 'inline-block';
                    }, 600);
                }
            }
            type();
        }

        // Start typing after a short delay
        setTimeout(typeTerminal, 800);

        // ===== Canvas Background =====
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let nodes = [];
        let mouse = { x: -100, y: -100 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function initNodes() {
            nodes = [];
            const count = Math.floor((canvas.width * canvas.height) / 20000);
            for (let i = 0; i < count; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    radius: Math.random() * 2.5 + 1
                });
            }
        }

        function initParticles() {
            particles = [];
            const count = 60;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    radius: Math.random() * 3 + 0.5,
                    alpha: Math.random() * 0.6 + 0.1
                });
            }
        }

        initNodes();
        initParticles();
        window.addEventListener('resize', () => { initNodes(); initParticles(); });

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        canvas.addEventListener('mouseleave', () => { mouse.x = -100; mouse.y = -100; });

        // Noise texture
        const noiseCanvas = document.createElement('canvas');
        const noiseCtx = noiseCanvas.getContext('2d');
        function generateNoise() {
            noiseCanvas.width = canvas.width;
            noiseCanvas.height = canvas.height;
            const imageData = noiseCtx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const v = Math.random() * 12;
                data[i] = v;
                data[i + 1] = v;
                data[i + 2] = v;
                data[i + 3] = 255;
            }
            noiseCtx.putImageData(imageData, 0, 0);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nodes
            nodes.forEach(n => {
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(16,185,129,0.35)';
                ctx.fill();
            });

            // Connections
            ctx.strokeStyle = 'rgba(16,185,129,0.06)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 140) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(52,211,153,${p.alpha})`;
                ctx.fill();
            });

            // Mouse glow
            if (mouse.x > -50) {
                const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 200);
                gradient.addColorStop(0, 'rgba(16,185,129,0.1)');
                gradient.addColorStop(0.5, 'rgba(16,185,129,0.03)');
                gradient.addColorStop(1, 'rgba(16,185,129,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(mouse.x - 200, mouse.y - 200, 400, 400);
            }

            // Noise overlay
            generateNoise();
            ctx.globalAlpha = 0.03;
            ctx.drawImage(noiseCanvas, 0, 0);
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
