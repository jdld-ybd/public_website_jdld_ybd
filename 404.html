<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 绝对零度个人网站</title>
    <link rel="icon" href="JDLD.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --secondary-dark: #db2777;
            --accent: #f59e0b;
            --background: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --glow: 0 0 40px rgba(99, 102, 241, 0.3);
            --gradient-main: linear-gradient(135deg, #6366f1 0%, #8b5cf6 25%, #ec4899 50%, #f59e0b 75%, #6366f1 100%);
            --gradient-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }
        
        body {
            font-family: 'Noto Sans SC', 'Poppins', sans-serif;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--gradient-bg);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(245, 158, 11, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        header {
            background: transparent;
            color: white;
            padding: 6rem 2rem 4rem;
            text-align: center;
            position: relative;
            overflow: visible;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            filter: blur(40px);
            animation: orbit 15s linear infinite;
        }
        
        @keyframes orbit {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }
        
        nav {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
        }
        
        nav.scrolled {
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        
        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding: 0.7rem 1.2rem;
            border-radius: 9999px;
            letter-spacing: -0.02em;
        }
        
        nav a:hover {
            color: var(--text-primary);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            transform: translateY(-2px);
        }
        
        nav a::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            padding: 1px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        nav a:hover::before {
            opacity: 1;
        }
        
        main {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }
        
        .error-container {
            text-align: center;
            padding: 5rem 3rem;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .error-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-main);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }
        
        .error-container:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
        }
        
        .error-container:hover::before {
            opacity: 0.1;
        }
        
        .error-code {
            font-size: 10rem;
            font-weight: 800;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            line-height: 1;
            animation: glow 3s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.3)); }
            50% { filter: drop-shadow(0 0 40px rgba(99, 102, 241, 0.6)); }
        }
        
        .error-message {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        
        .error-description {
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }
        
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1.1rem 3rem;
            background: var(--gradient-main);
            color: white;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .back-home::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        
        .back-home:hover::before {
            transform: translateX(100%);
        }
        
        .back-home:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5);
        }
        
        footer {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
            margin-top: 5rem;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
            position: relative;
        }
        
        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gradient-main);
            opacity: 0.5;
        }
        
        footer p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
        
        @media (max-width: 768px) {
            header {
                padding: 4rem 1rem 3rem;
            }
            
            nav {
                padding: 1rem 1rem;
            }
            
            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
            
            main {
                margin: 2rem auto;
                padding: 0 1rem;
            }
            
            .error-container {
                padding: 4rem 1.5rem;
            }
            
            .error-code {
                font-size: 6rem;
            }
            
            .error-message {
                font-size: 1.5rem;
            }
        }
        
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient-main);
            color: white;
            border: none;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            z-index: 999;
            backdrop-filter: blur(10px);
        }
        
        .back-to-top:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body>
    <header>
        <h1>页面未找到</h1>
        <p>404 错误</p>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="projects.html">项目</a></li>
            <li><a href="skills.html">技能</a></li>
            <li><a href="contact.html">联系我</a></li>
            <li><a href="https://github.com/jdld-ybd/jdld-ybd/discussions/1" target="_blank">社区</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="error-container">
            <div class="error-code">404</div>
            <div class="error-message">抱歉，您访问的页面不存在</div>
            <div class="error-description">
                您可能输入了错误的网址，或者该页面已被删除。
                请检查您的链接是否正确，或返回首页继续浏览。
            </div>
            <a href="index.html" class="back-home">返回首页</a>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 绝对零度的个人网站. All rights reserved.</p>
    </footer>
    
    <!-- 回到顶部按钮 -->
    <button id="backToTop" class="back-to-top">↑</button>
    
    <script>
        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });
        
        // 回到顶部按钮功能
        const backToTopButton = document.getElementById('backToTop');
        
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                backToTopButton.style.display = 'block';
                backToTopButton.style.opacity = '1';
            } else {
                backToTopButton.style.opacity = '0';
                setTimeout(() => {
                    if (window.scrollY <= 300) {
                        backToTopButton.style.display = 'none';
                    }
                }, 300);
            }
        });
        
        backToTopButton.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
