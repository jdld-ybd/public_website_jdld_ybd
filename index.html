<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝对零度个人网站</title>
    <link rel="icon" href="JDLD.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --secondary-dark: #db2777;
            --accent: #f59e0b;
            --background: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --glow: 0 0 40px rgba(99, 102, 241, 0.3);
            --gradient-main: linear-gradient(135deg, #6366f1 0%, #8b5cf6 25%, #ec4899 50%, #f59e0b 75%, #6366f1 100%);
            --gradient-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }
        
        body {
            font-family: 'Noto Sans SC', 'Poppins', sans-serif;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--gradient-bg);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(245, 158, 11, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        header {
            background: transparent;
            color: white;
            padding: 6rem 2rem 4rem;
            text-align: center;
            position: relative;
            overflow: visible;
        }
        
        header::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            filter: blur(40px);
            animation: orbit 15s linear infinite;
        }
        
        @keyframes orbit {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }
        
        nav {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
        }
        
        nav.scrolled {
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        
        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            padding: 0.7rem 1.2rem;
            border-radius: 9999px;
            letter-spacing: -0.02em;
        }
        
        nav a:hover {
            color: var(--text-primary);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            transform: translateY(-2px);
        }
        
        nav a::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            padding: 1px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        nav a:hover::before {
            opacity: 1;
        }
        
        main {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }
        
        section {
            margin-bottom: 5rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease forwards;
        }
        
        section:nth-child(1) { animation-delay: 0.1s; }
        section:nth-child(2) { animation-delay: 0.2s; }
        section:nth-child(3) { animation-delay: 0.3s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h2 {
            color: var(--text-primary);
            margin-bottom: 2.5rem;
            font-size: 2.2rem;
            font-weight: 700;
            position: relative;
            padding-bottom: 1.2rem;
            letter-spacing: -0.03em;
        }
        
        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 4px;
            background: var(--gradient-main);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }
        
        .hero {
            text-align: center;
            margin-bottom: 5rem;
            padding: 5rem 3rem;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: var(--gradient-main);
            border-radius: 24px;
            z-index: -1;
            opacity: 0.5;
            animation: gradientRotate 8s linear infinite;
        }
        
        @keyframes gradientRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.04em;
            position: relative;
        }
        
        .typewriter {
            border-right: 0.15em solid var(--primary);
            margin: 0 auto;
            letter-spacing: 0.05em;
            display: inline-block;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .typing {
            animation: blink-caret 0.75s step-end infinite;
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--primary); }
        }
        
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient-main);
            color: white;
            border: none;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            z-index: 999;
            backdrop-filter: blur(10px);
        }
        
        .back-to-top:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5);
        }
        
        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }
        
        .cta-button {
            display: inline-block;
            padding: 1.1rem 3rem;
            background: var(--gradient-main);
            color: white;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .cta-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        
        .cta-button:hover::before {
            transform: translateX(100%);
        }
        
        .cta-button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5);
        }
        
        .featured-projects {
            margin-top: 4rem;
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2.5rem;
            margin-top: 2rem;
        }
        
        .project-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .project-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-main);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }
        
        .project-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: rgba(99, 102, 241, 0.4);
        }
        
        .project-card:hover::before {
            opacity: 0.1;
        }
        
        .project-card h3 {
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        
        .project-card p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }
        
        .project-card a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            padding: 0.5rem 0;
        }
        
        .project-card a:hover {
            color: var(--secondary);
            gap: 1rem;
        }
        
        .project-card a::after {
            content: '→';
            transition: transform 0.3s ease;
            font-size: 1.2em;
        }
        
        .project-card a:hover::after {
            transform: translateX(5px);
        }
        
        .skills-preview {
            margin-top: 4rem;
        }
        
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .skill-tag {
            background: var(--gradient-main);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .skill-tag::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        
        .skill-tag:hover::before {
            transform: translateX(100%);
        }
        
        .skill-tag:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }
        
        footer {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
            margin-top: 5rem;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
            position: relative;
        }
        
        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gradient-main);
            opacity: 0.5;
        }
        
        footer p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
        
        @media (max-width: 768px) {
            header {
                padding: 4rem 1rem 3rem;
            }
            
            nav {
                padding: 1rem 1rem;
            }
            
            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
            
            main {
                margin: 2rem auto;
                padding: 0 1rem;
            }
            
            .hero {
                padding: 3rem 1.5rem;
            }
            
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .typewriter {
                letter-spacing: 0.05em;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            h2 {
                font-size: 1.8rem;
            }
            
            .cta-button {
                padding: 1rem 2.5rem;
                font-size: 1rem;
            }
            
            .skill-tag {
                padding: 0.7rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>欢迎来到绝对零度个人网站</h1>
        <p>展示我的项目和技能</p>
    </header>
    
    <nav>
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="projects.html">项目</a></li>
            <li><a href="skills.html">技能</a></li>
            <li><a href="contact.html">联系我</a></li>
            <li><a href="https://github.com/jdld-ybd/jdld-ybd/discussions/1" target="_blank">社区</a></li>
        </ul>
    </nav>
    
    <main>
        <section class="hero">
            <h1 class="typewriter" id="typewriter"></h1>
            <p>不断学习新技术来提升自己的技能</p>
            <a href="contact.html" class="cta-button">联系我</a>
        </section>
        
        <section class="featured-projects">
            <h2>精选项目</h2>
            <div class="projects-grid">
                <div class="project-card">
                    <h3>个人作品集网站</h3>
                    <p>使用 React 和 Tailwind CSS 构建的个人作品集网站，展示了我的项目和技能。</p>
                    <a href="projects.html">查看详情</a>
                </div>
                <div class="project-card">
                    <h3>人脸图片批量处理</h3>
                    <p>使用python编写的人脸批量整理分类工具 </p>
                    <a href="projects.html">查看详情</a>
                </div>
            </div>
        </section>
        
        <section class="skills-preview">
            <h2>技能预览</h2>
            <div class="skills-list">
                <span class="skill-tag">python基础语法</span>
                <span class="skill-tag">python爬虫基础</span>
                <span class="skill-tag">pygame基础</span>
                <span class="skill-tag">Git基础</span>
            </div>
            <p style="margin-top: 1rem;"><a href="skills.html" style="color: #667eea; text-decoration: none; font-weight: bold;">查看完整技能列表</a></p>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 绝对零度的个人网站. All rights reserved.</p>
    </footer>
    
    <!-- 回到顶部按钮 -->
    <button id="backToTop" class="back-to-top">↑</button>
    
    <script>
        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });
        
        // 打字机效果
        document.addEventListener('DOMContentLoaded', function() {
            const typewriter = document.getElementById('typewriter');
            const text = '你好，我是一名爱好编程的初中生';
            let index = 0;
            const speed = 120;
            
            function type() {
                if (index < text.length) {
                    typewriter.textContent += text.charAt(index);
                    typewriter.classList.add('typing');
                    index++;
                    setTimeout(type, speed);
                } else {
                    setTimeout(() => {
                        typewriter.classList.remove('typing');
                        typewriter.style.borderRight = 'none';
                    }, 1500);
                }
            }
            
            setTimeout(type, 500);
        });
        
        // 回到顶部按钮功能
        const backToTopButton = document.getElementById('backToTop');
        
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                backToTopButton.style.display = 'block';
                backToTopButton.style.opacity = '1';
            } else {
                backToTopButton.style.opacity = '0';
                setTimeout(() => {
                    if (window.scrollY <= 300) {
                        backToTopButton.style.display = 'none';
                    }
                }, 300);
            }
        });
        
        backToTopButton.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
